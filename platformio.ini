; PlatformIO project configuration
; Target: ESP32-S3-N16R8 (16MB Quad flash / 8MB Octal PSRAM)
; See HARDWARE.md for the locked pinout and FEATURES.md for the BLE audit
; suite spec. README.md has build/flash instructions and the legal notice.

[env:esp32-s3-audit]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 = 16MB Quad flash + 8MB Octal PSRAM
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
; Kept our own validated 16MB table (app + LittleFS for logs) instead of the
; platform's bundled default_16MB.csv, which we haven't verified carries a
; LittleFS-sized data partition.
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800 ; CP2102 UART bridge, not the S3's native USB

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0     ; flash/console go through the CP2102 UART

    ; ---- TFT_eSPI config (compile-time, no User_Setup.h needed) ----
    -DUSER_SETUP_LOADED
    -DILI9341_DRIVER
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=-1        ; RST tied to the board's own reset line
    -DTFT_BL=48
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DSMOOTH_FONT
    -DSPI_FREQUENCY=40000000

lib_deps =
    adafruit/RTClib @ ^2.1.4
    bodmer/TFT_eSPI @ ^2.5.43
    h2zero/NimBLE-Arduino @ ^1.4.3
    mikalhart/TinyGPSPlus @ ^1.0.3
    nrf24/RF24 @ ^1.4.8
    crankyoldgit/IRremoteESP8266 @ ^2.9.0
    jgromes/RadioLib @ ^6.6.0
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.9
    MFRC522
