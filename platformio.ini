; PlatformIO project configuration
; Target: ESP32-S3-N16R8 (16MB Quad flash / 8MB Octal PSRAM)
; See README.md for wiring and legal/ethics notice.

[env:esp32-s3-audit]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 = 16MB Quad flash + 8MB Octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0

lib_deps =
    adafruit/RTClib @ ^2.1.4
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ILI9341 @ ^1.6.3
    mikalhart/TinyGPSPlus @ ^1.0.3
    nrf24/RF24 @ ^1.4.8
    crankyoldgit/IRremoteESP8266 @ ^2.9.0
    https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git
