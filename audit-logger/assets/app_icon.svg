<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .shark { fill: #2c3e50; }
      .shark-accent { fill: #34495e; }
      .shark-white { fill: #ecf0f1; }
      .boot { fill: #1a1a1a; }
      .skull { fill: #f39c12; }
      .boot-accent { fill: #e67e22; }
    </style>
  </defs>

  <!-- Gradient background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bgGrad)"/>

  <!-- Boot with skull (right side, bottom) -->
  <g transform="translate(130, 120)">
    <!-- Boot shaft -->
    <path class="boot" d="M -15 0 L -20 40 L -5 45 L 5 45 L 20 40 L 15 0 Z"/>

    <!-- Boot sole -->
    <ellipse class="boot-accent" cx="0" cy="48" rx="18" ry="6"/>

    <!-- Boot details (laces) -->
    <line x1="-8" y1="10" x2="8" y2="10" stroke="#555" stroke-width="1"/>
    <line x1="-8" y1="20" x2="8" y2="20" stroke="#555" stroke-width="1"/>
    <line x1="-8" y1="30" x2="8" y2="30" stroke="#555" stroke-width="1"/>

    <!-- Skull on boot -->
    <g transform="translate(0, 15)">
      <!-- Skull main -->
      <circle class="skull" cx="0" cy="-3" r="8"/>

      <!-- Jaw -->
      <ellipse class="skull" cx="0" cy="6" rx="6" ry="4"/>

      <!-- Eye sockets -->
      <circle fill="#000" cx="-3" cy="-4" r="2"/>
      <circle fill="#000" cx="3" cy="-4" r="2"/>

      <!-- Nose hole -->
      <ellipse fill="#000" cx="0" cy="0" rx="1.5" ry="2"/>

      <!-- Teeth -->
      <line x1="-4" y1="6" x2="-2" y2="8" stroke="#000" stroke-width="0.5"/>
      <line x1="-1" y1="6" x2="1" y2="8" stroke="#000" stroke-width="0.5"/>
      <line x1="2" y1="6" x2="4" y2="8" stroke="#000" stroke-width="0.5"/>
    </g>
  </g>

  <!-- Shark (left/center) -->
  <g transform="translate(50, 70)">
    <!-- Shark body -->
    <ellipse class="shark" cx="0" cy="0" rx="35" ry="20"/>

    <!-- Shark head -->
    <ellipse class="shark" cx="-30" cy="-5" rx="18" ry="15"/>

    <!-- Snout -->
    <path class="shark-accent" d="M -45 -5 L -55 -3 L -50 0 Z"/>

    <!-- Shark eye (menacing) -->
    <circle class="shark-white" cx="-35" cy="-10" r="4"/>
    <circle fill="#1a1a1a" cx="-35" cy="-10" r="2.5"/>
    <circle fill="#f39c12" cx="-34" cy="-11" r="1"/>

    <!-- Gill slits -->
    <line x1="-20" y1="-8" x2="-15" y2="-8" stroke="#1a1a1a" stroke-width="2" opacity="0.6"/>
    <line x1="-20" y1="0" x2="-15" y2="0" stroke="#1a1a1a" stroke-width="2" opacity="0.6"/>
    <line x1="-20" y1="8" x2="-15" y2="8" stroke="#1a1a1a" stroke-width="2" opacity="0.6"/>

    <!-- Top fin -->
    <path class="shark-accent" d="M 0 -18 L 5 -28 L 8 -18 Z"/>

    <!-- Bottom fins (pectoral) -->
    <path class="shark-accent" d="M -5 15 L -15 22 L 0 18 Z"/>
    <path class="shark-accent" d="M 5 15 L 15 22 L 10 18 Z"/>

    <!-- Tail fin -->
    <path class="shark-accent" d="M 30 -3 L 50 -12 L 35 8 Z"/>

    <!-- Teeth (menacing smile) -->
    <g transform="translate(-50, -2)">
      <polygon fill="#fff" points="-2,0 0,3 2,0"/>
      <polygon fill="#fff" points="-4,0 -1,3 1,0"/>
      <polygon fill="#fff" points="0,0 3,3 5,0"/>
      <polygon fill="#fff" points="2,0 5,3 7,0"/>
    </g>

    <!-- Spots/markings -->
    <circle class="shark-accent" cx="-10" cy="-5" r="2" opacity="0.7"/>
    <circle class="shark-accent" cx="10" cy="5" r="2" opacity="0.7"/>
    <circle class="shark-accent" cx="15" cy="-8" r="1.5" opacity="0.7"/>
  </g>

  <!-- Border circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#f39c12" stroke-width="2" opacity="0.5"/>

  <!-- Small accent dots -->
  <circle cx="20" cy="30" r="2" fill="#e74c3c" opacity="0.6"/>
  <circle cx="180" cy="170" r="2" fill="#e74c3c" opacity="0.6"/>
</svg>
