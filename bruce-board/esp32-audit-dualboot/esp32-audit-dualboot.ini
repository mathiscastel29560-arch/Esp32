; Custom Bruce board profile for the ESP32-S3-N16R8 audit tool, wired per
; HARDWARE.md. Builds Bruce as the ota_1 partition of the dual-boot
; partition table shared with the audit firmware's own ota_0 — see
; partitions_16mb.csv and README.md "Dual-boot with Bruce" for the full
; scheme. This env is only ever built from this standalone Bruce
; checkout and flashed with `esptool.py --partition-table ... write_flash
; 0x310000 firmware.bin` (or the helper script) — it is NOT part of the
; audit tool's own PlatformIO project.
[env:esp32-audit-dualboot]
board = esp32-audit-dualboot
board_build.arduino.memory_type = qio_opi ; N16R8 = 8MB Octal PSRAM
board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/esp32-audit-dualboot>
build_flags =
	${env.build_flags}
	-Iboards/esp32-audit-dualboot
	-Os
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DCORE_DEBUG_LEVEL=0
	-DDEVICE_NAME='"ESP32 Audit Tool (dual-boot)"'

	; Infrared: this board only has fixed TX/RX pins (no interchangeable
	; modules), unlike most Bruce boards' selectable IR_TX_PINS/IR_RX_PINS.
	-DIR_TX_PINS='{{"IR LED", TXLED}}'
	-DIR_RX_PINS='{{"IR RX", RXLED}}'
	; precompiler_flags.h redefines ALL FOUR of IR_TX_PINS/IR_RX_PINS/
	; RF_TX_PINS/RF_RX_PINS to a raw GPIO picker if ANY of the four is
	; left undefined -- which would silently clobber the two IR defines
	; above. No one-pin RF module wired here (CC1101 is on SPI, handled
	; separately), so these are just defined to what they'd default to
	; anyway, purely to stop that clobber.
	-DRF_TX_PINS=GPIO_PIN_LIST
	-DRF_RX_PINS=GPIO_PIN_LIST

lib_deps =
	${env.lib_deps}
